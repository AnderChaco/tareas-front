<!DOCTYPE html>
<html>
    <head>
        <title>Lista de Tareas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Estilos con Bootstrap -->
        <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
        <!-- Estilos personalizados -->
        <link href="css/custom-styles.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>

        <!-- Barra de navegación -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a href="#" class="navbar-brand">
                    <img src="img/icon.png" alt="To Do logo" width="30"/>
                    Lista de Tareas
                </a>
            </div>
        </nav>

        <!-- Contenido (Lista de tareas) -->
        <div class="container-fluid py-4 px-4">

            <div class="card">
                <div class="card-header">
                    <div class="card-title">
                        Mis tareas
                    </div>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush" id="tareasListGroup">
                        <li class="list-group-item text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="card-footer">
                    <button type="button" class="btn btn-primary btn-sm float-end" onclick="nuevaTarea();">
                        Nueva Tarea
                    </button>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="toDoModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Nueva Tarea</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="descri">Descripción</label>
                        <input type="text" id="descri" class="form-control">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-success">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- JS de Bootstrap -->
        <script src="js/vendors/bootstrap.bundle.min.js" type="text/javascript"></script>
        <script src="js/script.js" type="text/javascript"></script>
        <script src="js/list-all-tareas.js" type="text/javascript"></script>
    </body>
</html>
